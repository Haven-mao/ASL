name: Source checks
on: [push, pull_request]
jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_android_mcp.py -v
      - run: python -m compileall -q guest scripts
      - run: for file in scripts/*.sh; do bash -n "$file"; done
